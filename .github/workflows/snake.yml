name: snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#256b4c&color_dots=#ebedf0,#d9e8df,#5fbf8e,#256b4c,#10201a
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#c5e86c&color_dots=#161b22,#15251e,#256b4c,#5fbf8e,#c5e86c

      - run: sudo curl -sfL https://ghchart.rshah.org/5FBF8E/rod-br -o dist/activity.svg

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
