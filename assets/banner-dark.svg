  <desc id="d">Banner verde y negro con estilo terminal.</desc>
  <defs>
    <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#0f2417" stroke-width="1"/></pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="960" height="260" rx="16" fill="#050805"/>
  <rect width="960" height="260" rx="16" fill="url(#g)"/>
  <rect x="1" y="1" width="958" height="258" rx="15" fill="none" stroke="#4ade80" stroke-opacity=".6" stroke-width="2"/>
